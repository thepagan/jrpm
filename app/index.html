<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JR Pass Route Planner</title>

  <!-- Load Leaflet CSS -->
  <link rel="stylesheet" href="static/css/leaflet.css" />

  <!-- Load Leaflet JS synchronously (no defer/async) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Maps JS API will be injected dynamically -->

  <!-- Your local styles -->
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div id="route-planner">
  <h1>JR Pass Route Planner</h1>

  <div class="address-inputs">
    <div class="input-group">
      <label for="start-address">Start Address:</label>
      <input type="text" id="start-address" placeholder="Enter Start Address" />
    </div>

    <div class="input-group">
      <label for="end-address">End Address:</label>
      <input type="text" id="end-address" placeholder="Enter End Address" />
    </div>

    <button id="plan-route">Plan Route</button>
  </div>

  <div id="route-summary" class="hidden">
    <h2>Route Summary</h2>
    <div id="route-steps">
      <!-- Walking + Train + Walking segments go here -->
    </div>
    <div id="total-time">
      <!-- Estimated total time will show here -->
    </div>
  </div>

</div>

<div id="map" style="height: 600px; margin-top: 20px;"></div>

<!-- Load your main JS after Leaflet is available -->
<script type="module" src="static/js/index.js"></script>

</body>
</html>
