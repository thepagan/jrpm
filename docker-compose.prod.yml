version: "3.8"

services:
  jr-pass-map:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jr-pass-map
    restart: unless-stopped
    networks:
      jrpm-net:
        ipv4_address: 172.28.0.10
    depends_on:
      - api
    # No direct port exposure — assume reverse proxy (nginx/traefik) will handle external access

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: jrpm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/data:/docker-entrypoint-initdb.d/data
    restart: unless-stopped
    networks:
      jrpm-net:
        ipv4_address: 172.28.0.11
    # 🔥 No exposed ports — internal only!

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jrpm-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      jrpm-net:
        ipv4_address: 172.28.0.12
    expose:
      - "5050"
    # 🔥 Expose only inside Docker network (not to host directly)

volumes:
  pgdata:

networks:
  jrpm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.driver.mtu: 1450
  nginx:
    image: nginx:stable
    container_name: jrpm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jr-pass-map
      - api
    networks:
      jrpm-net:
        ipv4_address: 172.28.0.13